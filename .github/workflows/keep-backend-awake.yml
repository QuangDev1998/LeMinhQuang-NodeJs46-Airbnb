name: KEEP-BACKEND-AWAKE

# Giữ backend Render (gói free) luôn thức: Render ngủ sau 15 phút không có request.
# Cron mỗi 10 phút ping endpoint để server không bao giờ ngủ -> hết cold-start ~30-60s.
on:
  schedule:
    - cron: "*/10 * * * *" # mỗi 10 phút (GitHub có thể trễ vài phút khi tải cao)
  workflow_dispatch: {} # cho phép bấm chạy tay trong tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend để đánh thức
        run: |
          URL="https://airbnb-backend-goyc.onrender.com/api/vi-tri"
          echo "Ping $URL ..."
          # Render cold-start có thể tới ~60s -> timeout rộng + thử lại tối đa 3 lần.
          for i in 1 2 3; do
            code=$(curl -s -m 90 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Lần $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend đã thức ✅"
              exit 0
            fi
            sleep 10
          done
          echo "Không đánh thức được backend sau 3 lần ❌"
          exit 1

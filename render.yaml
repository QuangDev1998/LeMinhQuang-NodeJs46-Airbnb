# Render Blueprint — deploy backend (Postgres managed/Neon, miễn phí).
# Khởi động: đồng bộ schema (KHÔNG xoá data) -> seed nếu DB rỗng -> gắn ảnh nếu
# chưa có -> chạy app. Data người dùng TỒN TẠI VĨNH VIỄN qua mọi lần restart.
services:
  - type: web
    name: airbnb-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prod.prisma && npm run build
    # KHÔNG còn --force-reset: db push chỉ tạo bảng nếu thiếu, không xoá data.
    # seed.ts & update-room-images.js đã idempotent (tự bỏ qua khi đã có data).
    startCommand: npx prisma db push --schema=prisma/schema.prod.prisma --skip-generate && npx prisma db seed && node prisma/seed/update-room-images.js && node dist/src/main.js
    healthCheckPath: /api/vi-tri
    envVars:
      - key: DATABASE_URL
        # Connection string Neon (direct, KHÔNG -pooler), nhập tay trong Render
        # dashboard. VD: postgresql://user:pass@ep-xxx.region.aws.neon.tech/db?sslmode=require
        sync: false
      - key: CLIENT_URL
        value: "*"
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRED
        value: 1d
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRED
        value: 7d
      - key: NODE_VERSION
        value: "20"

# Render Blueprint — deploy backend demo (SQLite, miễn phí).
# Mỗi lần khởi động: tạo schema SQLite + seed dữ liệu + gắn ảnh thật rồi chạy app.
services:
  - type: web
    name: airbnb-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prod.prisma && npm run build
    startCommand: npx prisma db push --schema=prisma/schema.prod.prisma --force-reset --skip-generate && npx prisma db seed && node prisma/seed/update-room-images.js && node dist/src/main.js
    healthCheckPath: /api/vi-tri
    envVars:
      - key: DATABASE_URL
        value: file:./prod.db
      - key: CLIENT_URL
        value: https://air-bnb-vn.netlify.app
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRED
        value: 1d
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRED
        value: 7d
      - key: NODE_VERSION
        value: "20"
